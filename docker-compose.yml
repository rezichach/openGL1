version: '3'

services:
  opengl-app:
    build: .
    image: opengl1-app
    container_name: opengl1-container
    volumes:
      # Mount X11 socket for display
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Mount screenshots directory for persistence
      - ./openGL1/screenshots:/app/openGL1/screenshots
    environment:
      # For X11 forwarding (change this to your display if needed)
      - DISPLAY=${DISPLAY}
    # If you need to access the host network (useful for X11)
    network_mode: "host"
    # Keep the container running for debugging if needed
    # tty: true
    # stdin_open: true 